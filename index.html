<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Prompt Different - 2026 Premium AI Prompts</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ================= 2026 PREMIUM STYLES ================= */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#05030a;color:#fff;min-height:100vh;overflow-x:hidden}
body.modal-open{overflow:hidden}

.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;animation:float 10s infinite ease-in-out;z-index:-1}
.orb1{width:400px;height:400px;background:radial-gradient(#8b5cf6,#3b82f6);top:-100px;left:-100px;opacity:.4}
.orb2{width:500px;height:500px;background:radial-gradient(#ec4899,#8b5cf6);top:40%;right:-150px;opacity:.3}
.orb3{width:300px;height:300px;background:radial-gradient(#06b6d4,#3b82f6);bottom:-100px;left:10%;opacity:.3}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-30px)}}
.container{position:relative;z-index:2;max-width:1300px;margin:0 auto;padding:20px}

/* Navbar */
nav{display:flex;justify-content:space-between;align-items:center;background:rgba(20,15,40,0.6);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:12px 24px;position:sticky;top:15px;z-index:100}
.logo{font-weight:800;font-size:1.2rem;display:flex;gap:8px;align-items:center;letter-spacing:-.5px}
.logo .gradient-text{background:linear-gradient(90deg,#facc15,#f43f5e,#a855f7,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-btns{display:flex;gap:10px}
.admin-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;padding:10px 18px;border-radius:50px;font-weight:600;font-size:.85rem;cursor:pointer;transition:.3s}
.admin-btn:hover{background:rgba(255,255,255,.15)}
.join{background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:#fff;padding:10px 20px;border-radius:50px;text-decoration:none;font-weight:700;font-size:.85rem;transition:.3s;box-shadow:0 4px 15px rgba(59,130,246,.4)}

/* Hero & Stats */
.hero{text-align:center;padding:60px 10px 20px}
.hero h1{font-size:clamp(2.5rem,6vw,4.5rem);font-weight:800;line-height:1.1;letter-spacing:-2px;background:linear-gradient(90deg,#fff,#a855f7,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:15px}
.hero p{color:#9ca3af;font-size:1.1rem;font-weight:500}
.stats-bar{display:flex;justify-content:center;gap:30px;margin-top:30px}
.stat{text-align:center}
.stat-val{font-size:1.8rem;font-weight:800;color:#a855f7}
.stat-label{font-size:.8rem;color:#9ca3af;text-transform:uppercase;letter-spacing:1px}

/* Controls */
.controls{display:flex;flex-direction:column;align-items:center;gap:15px;margin:40px 0}
.search-box{width:100%;max-width:600px;position:relative}
.search{width:100%;background:rgba(20,15,40,.8);border:2px solid rgba(139,92,246,.3);border-radius:50px;padding:15px 25px;color:#fff;font-size:1rem;outline:none;transition:.3s}
.search:focus{border-color:#8b5cf6;box-shadow:0 0 20px rgba(139,92,246,.4)}
.filters{display:flex;gap:10px;overflow-x:auto;padding-bottom:5px;width:100%;justify-content:center;flex-wrap:wrap}
.fpill{white-space:nowrap;padding:10px 20px;border-radius:50px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#aaa;cursor:pointer;font-size:.9rem;font-weight:600;transition:.2s}
.fpill:hover{background:rgba(255,255,255,.1);color:#fff}
.fpill.active{background:#fff;color:#000;border-color:#fff}

/* Upload Box */
.upload{background:rgba(20,15,40,.8);backdrop-filter:blur(20px);border:1px solid rgba(139,92,246,.3);border-radius:24px;padding:30px;margin-bottom:40px;display:none;animation:pop .4s ease}
.upload.active{display:block}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.file-drop{border:2px dashed rgba(139,92,246,.4);border-radius:20px;padding:30px;text-align:center;cursor:pointer;background:rgba(139,92,246,.05)}
#preview{max-width:100%;margin-top:15px;border-radius:12px;display:none}
textarea,input[type="text"]{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(139,92,246,.3);border-radius:16px;padding:15px;color:#fff;font-family:inherit}

/* Gallery Cards */
.grid{columns:1;column-gap:20px;padding:10px 0}
@media(min-width:600px){.grid{columns:2}}
@media(min-width:900px){.grid{columns:3}}
@media(min-width:1200px){.grid{columns:4}}
.card{break-inside:avoid;background:rgba(20,15,40,.6);border:1px solid rgba(255,255,255,.08);border-radius:24px;overflow:hidden;margin-bottom:20px;transition:all .4s;position:relative}
.card:hover{transform:translateY(-8px);box-shadow:0 20px 40px rgba(0,0,0,.6);border-color:rgba(139,92,246,.5)}
.card img{width:100%;display:block;cursor:pointer}
.card-body{padding:20px}
.cat{font-size:.75rem;color:#c4b5fd;background:rgba(139,92,246,.2);padding:6px 14px;border-radius:50px;display:inline-block;margin-bottom:12px;font-weight:700}
.prompt{font-size:.9rem;color:#d1d5db;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:15px}
.actions{display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:14px;padding:12px;font-weight:700;font-size:.85rem;cursor:pointer}
.btn-copy{background:#fff;color:#000}
.btn-del{background:rgba(239,68,68,.15);color:#f87171;display:none;max-width:50px}
.btn-del.show{display:flex}

/* Modal, Login & Toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{max-width:900px;width:100%;background:#12102a;border:1px solid rgba(139,92,246,.3);border-radius:24px;overflow:hidden;display:grid;grid-template-columns:1fr}
.modal-box img{width:100%;height:100%;object-fit:cover;max-height:80vh}
.modal-info{padding:30px}

/* CUSTOM LOGIN BOX */
#loginModal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);z-index:2000;display:none;align-items:center;justify-content:center}
#loginModal.open{display:flex}
.login-box{background:#12102a;padding:30px;border-radius:20px;border:1px solid #8b5cf6;width:300px;text-align:center}
.login-box input{width:100%;padding:12px;margin:15px 0;border-radius:10px;border:1px solid #444;background:#000;color:#fff}
.login-box button{width:100%;padding:12px;border-radius:10px;background:#8b5cf6;color:#fff;font-weight:bold;border:none}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#fff;color:#000;padding:15px 30px;border-radius:50px;font-weight:800;transition:.4s;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>

<div class="container">
    <nav>
        <div class="logo">✨ AI Prompt <span class="gradient-text">Different</span></div>
        <div class="nav-btns">
            <button class="admin-btn" id="adminBtn">🔐 Admin</button>
            <a class="join" href="https://t.me/AiPromptdifferent" target="_blank">✈️ Join TG</a>
        </div>
    </nav>

    <div class="hero">
        <h1>The Future of AI Prompts</h1>
        <p>Discover, Copy, and Create stunning AI visuals. 2026 Edition.</p>
        <div class="stats-bar">
            <div class="stat"><div class="stat-val" id="totalPhotos">0</div><div class="stat-label">Photos</div></div>
            <div class="stat"><div class="stat-val" id="totalCats">0</div><div class="stat-label">Categories</div></div>
        </div>
    </div>

    <div class="controls">
        <div class="search-box"><input type="text" class="search" id="search" placeholder="🔍 Search prompts, categories, styles..."></div>
        <div class="filters" id="filters"></div>
    </div>

    <div class="upload" id="uploadBox">
        <div class="upload-grid">
            <label class="file-drop">
                <div style="font-size:2rem;margin-bottom:10px">⬆️</div>
                <div style="font-weight:600">Click to upload image</div>
                <img id="preview">
                <input type="file" id="imageInput" accept="image/*" hidden>
            </label>
            <div>
                <textarea id="promptInput" placeholder="Enter detailed prompt..." style="min-height:120px;margin-bottom:10px"></textarea>
                <input type="text" id="categoryInput" list="categoryOptions" placeholder="Category (e.g. Cute)" style="margin-bottom:15px">
                <datalist id="categoryOptions"></datalist>
            </div>
        </div>
        <button class="btn btn-copy" id="uploadBtn" style="width:100%;padding:16px;">✨ Upload to Vault</button>
    </div>

    <div class="grid" id="gallery"></div>

    <footer style="margin-top:80px;text-align:center;padding:40px 0;border-top:1px solid #222">
        <h2 style="font-size:1.8rem;margin-bottom:15px">Join Our Community</h2>
        <p style="color:#9ca3af;margin-bottom:20px">Daily HD AI Prompts • Free Download • No Watermark</p>
        <a href="https://t.me/AiPromptdifferent" target="_blank" class="join">✈️ Join Telegram</a>
    </footer>
</div>

<!-- POPUP MODAL FOR PHOTO -->
<div class="modal" id="modal">
    <div class="modal-box">
        <img id="modalImg">
        <div class="modal-info">
            <div id="modalCat" class="cat"></div>
            <h3 style="margin-bottom:15px">Prompt Details</h3>
            <p id="modalPrompt" style="color:#d1d5db;margin-bottom:20px;line-height:1.6"></p>
            <div style="display:flex;gap:10px">
                <button class="btn btn-copy" id="modalCopy">📋 Copy Prompt</button>
                <a id="modalDown" class="btn btn-copy" style="text-decoration:none;text-align:center" download>⬇️ Download</a>
            </div>
            <button onclick="closeModal()" style="margin-top:20px;background:none;border:none;color:#666;cursor:pointer">✕ Close</button>
        </div>
    </div>
</div>

<!-- CUSTOM LOGIN MODAL (Bina browser popup ke) -->
<div id="loginModal">
    <div class="login-box">
        <h3 style="color:#a855f7">🔐 Admin Login</h3>
        <input type="password" id="passInput" placeholder="Enter Password">
        <button onclick="doLogin()">Login</button>
        <button onclick="document.getElementById('loginModal').classList.remove('open')" style="background:none;margin-top:10px;color:#666">Cancel</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyBPvoo4ro_ZcTb8b4R0hjSpkmIFdwZ8R3A", authDomain: "ai-prompt-vault-e81ab.firebaseapp.com", projectId: "ai-prompt-vault-e81ab", storageBucket: "ai-prompt-vault-e81ab.firebasestorage.app", messagingSenderId: "191570252019", appId: "1:191570252019:web:c9c8277ee0517496e5a786" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

const IMGBB = "f2bc8c696079631a3204f021341771f4"; const PASS = "New_alfez";
let allData = []; let activeCat = "All"; let deepLinkProcessed = false;

const gallery=document.getElementById('gallery'), adminBtn=document.getElementById('adminBtn'), uploadBox=document.getElementById('uploadBox'), imageInput=document.getElementById('imageInput'), preview=document.getElementById('preview'), promptInput=document.getElementById('promptInput'), categoryInput=document.getElementById('categoryInput'), uploadBtn=document.getElementById('uploadBtn'), search=document.getElementById('search');
let file=null;

// ADMIN LOGIC (Custom Popup)
function isAdmin(){return localStorage.getItem('isAdmin')==='true'}
function checkAdmin(){if(isAdmin()){uploadBox.classList.add('active'); adminBtn.textContent='✅ Admin';}}
checkAdmin();

adminBtn.onclick=()=>{
    if(isAdmin()){
        if(confirm('Logout?')){
            localStorage.removeItem('isAdmin'); 
            uploadBox.classList.remove('active'); 
            adminBtn.textContent='🔐 Admin'; 
            load();
        }
    } else {
        document.getElementById('loginModal').classList.add('open');
        document.getElementById('passInput').focus();
    }
};

window.doLogin = () => {
    const p = document.getElementById('passInput').value;
    if(p === PASS){
        localStorage.setItem('isAdmin','true'); 
        uploadBox.classList.add('active'); 
        adminBtn.textContent='✅ Admin'; 
        toast('Admin login!'); 
        document.getElementById('loginModal').classList.remove('open');
        document.getElementById('passInput').value = '';
        load();
    } else {
        toast('Wrong password');
    }
};

// UPLOAD LOGIC
imageInput.addEventListener('change',e=>{file=e.target.files[0]; const r=new FileReader(); r.onload=ev=>{preview.src=ev.target.result; preview.style.display='block'}; r.readAsDataURL(file);});
function toast(m){const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000);}

uploadBtn.onclick=async()=>{
    if(!file) return toast('Photo select karo'); 
    if(!promptInput.value.trim()) return toast('Prompt likho'); 
    if(!categoryInput.value.trim()) return toast('Category likho'); 
    
    uploadBtn.disabled=true; uploadBtn.textContent='⏳ Uploading HD...'; 
    try{ 
        const fd=new FormData(); fd.append('image',file); 
        const res=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB}`,{method:'POST',body:fd}); 
        const j=await res.json(); 
        if(!j.success) throw new Error('Upload fail'); 
        
        await addDoc(collection(db,'prompts'),{
            image:j.data.url,
            prompt:promptInput.value.trim(),
            category:categoryInput.value.trim(),
            createdAt:serverTimestamp()
       }); 
        toast('🎉 Uploaded!'); 
        file=null; preview.style.display='none'; promptInput.value=''; categoryInput.value=''; load(); 
    }catch(e){toast(e.message)} 
    finally{uploadBtn.disabled=false; uploadBtn.textContent='✨ Upload to Vault'}
};

window.copyPrompt=(t)=>{navigator.clipboard.writeText(t); toast('✅ Prompt copied!');};
window.deleteCard=async(id)=>{if(!isAdmin()) return toast('Admin only'); if(!confirm('Delete?')) return; await deleteDoc(doc(db,'prompts',id)); toast('Deleted'); load();};

/* --- BACK BUTTON FIX --- */
window.openModal = (img, cat, prompt) => {
  document.getElementById('modalImg').src = img; 
  document.getElementById('modalCat').textContent = cat; 
  document.getElementById('modalPrompt').textContent = prompt; 
  document.getElementById('modalDown').href = img; 
  document.getElementById('modal').classList.add('open'); 
  document.getElementById('modalCopy').onclick = () => copyPrompt(prompt); 
  
  document.body.classList.add('modal-open');
  const photoId = allData.find(x => (x.imageUrl || x.image) === img)?.id || '';
  window.history.pushState({ modalOpen: true }, "", `?id=${photoId}`);
};

window.closeModal = () => {
  if (window.history.state && window.history.state.modalOpen) { window.history.back(); } 
  else {
    document.getElementById('modal').classList.remove('open'); 
    document.body.classList.remove('modal-open');
    window.history.replaceState(null, null, window.location.pathname);
  }
};

document.getElementById('modal').onclick = e => { if(e.target.id === 'modal') closeModal(); };
window.addEventListener('popstate', (e) => {
  if (!e.state || !e.state.modalOpen) {
    document.getElementById('modal').classList.remove('open');
    document.body.classList.remove('modal-open');
  }
});

// RENDER & LOAD
function render(list){
  gallery.innerHTML='';
  if(!list.length){gallery.innerHTML='<div style="color:#666;column-span:all;text-align:center;padding:50px">No results found 🥲</div>'; return;}
  list.forEach((d, index)=>{
    const imgSrc = d.imageUrl || d.image || "";
    const div=document.createElement('div');
    div.className='card'; div.id = `photo-${d.id}`;
    div.innerHTML=`
        <img src="${imgSrc}" loading="lazy" onclick="openModal('${imgSrc}','${d.category}','${d.prompt.replace(/'/g,"\\'")}')">
        <div class="card-body">
            <div class="cat">📋 ${d.category}</div>
            <p class="prompt">${d.prompt}</p>
            <div class="actions">
                <button class="btn btn-copy" onclick="copyPrompt(\`${d.prompt.replace(/`/g,'')}\`)">📋 Copy</button>
                <button class="btn btn-del ${isAdmin()?'show':''}" onclick="deleteCard('${d.id}')">🗑️</button>
            </div>
        </div>`;
    gallery.appendChild(div);
  });
}

async function load(){
  try{
    const snap=await getDocs(collection(db,'prompts'));
    allData=[]; snap.forEach(doc=>allData.push({id:doc.id,...doc.data()})); allData.reverse();
    document.getElementById('totalPhotos').textContent = allData.length;

    const categoryMap = {};
    allData.forEach(item => {
      if (item.category && item.category.trim() !== "") {
        let key = item.category.trim().toLowerCase();
        if (!categoryMap[key]) categoryMap[key] = item.category.trim().charAt(0).toUpperCase() + item.category.trim().slice(1);
      }
    });
    const uniqueCategories = Object.keys(categoryMap).sort();
    document.getElementById('totalCats').textContent = uniqueCategories.length;

    let filtersHTML = '<div class="fpill active" data-cat="All">All</div>';
    uniqueCategories.forEach(key => { filtersHTML += `<div class="fpill" data-cat="${key}">${categoryMap[key]}</div>`; });
    document.getElementById('filters').innerHTML = filtersHTML;
    
    const datalist = document.getElementById('categoryOptions');
    if(datalist) {
      datalist.innerHTML = '';
      uniqueCategories.forEach(key => { datalist.innerHTML += `<option>${categoryMap[key]}</option>`; });
    }
    
    document.querySelectorAll('.fpill').forEach(p=>{
       p.onclick=()=>{
         document.querySelectorAll('.fpill').forEach(x=>x.classList.remove('active'));
         p.classList.add('active'); activeCat=p.dataset.cat; applyFilter();
       }
    });
    applyFilter();
  }catch(e){
    // Agar error aaye toh screen par dikhega
    gallery.innerHTML='<div style="color:#f87171;text-align:center;padding:20px;column-span:all">Firebase Error: '+e.message+'</div>';
  }
}

function applyFilter(){
  let f=[...allData];
  if(activeCat!=='All') f=f.filter(x=>x.category && x.category.trim().toLowerCase()===activeCat.toLowerCase());
  const q=search.value.toLowerCase();
  if(q) f=f.filter(x=>x.prompt.toLowerCase().includes(q)||x.category.toLowerCase().includes(q));
  render(f);
}
search.oninput=applyFilter;
load();
</script>
</body>
</html>
