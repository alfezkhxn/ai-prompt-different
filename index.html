/* ================= 2026 CYBER-LUXE STYLES ================= */
:root {
    --bg: #050508;

    --secondary: #0ea5e9;

*{margin:0;padding:0;box-sizing:border-box}

}

.container{position:relative;z-index:2;max-width:1400px;margin:0 auto;padding:20px}

.btn-admin{
    background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--text);

}
.btn-admin:hover{ background:rgba(255,255,255,0.1); }

.btn-join{

/* Hero Section */
.hero{ text-align:center; padding:80px 10px 40px; }
.hero h1{
    font-size:clamp(3rem, 8vw, 5.5rem); font-weight:700; line-height:1.1; letter-spacing:-2px;
    background:linear-gradient(180deg, #fff, #a1a1aa); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    margin-bottom:15px;
}
.hero p{ color:var(--text-muted); font-size:1.2rem; max-width:600px; margin:0 auto; }
.stats-bar{ display:flex; justify-content:center; gap:40px; margin-top:40px; }

.stat-label{ font-size:0.8rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }

/* Controls (Search + Filters) */
.controls{ display:flex; flex-direction:column; align-items:center; gap:20px; margin:50px 0; }
.search-box{ width:100%; max-width:700px; position:relative; }
.search{

.filters{ display:flex; gap:10px; overflow-x:auto; width:100%; justify-content:center; flex-wrap:wrap; }
.fpill{

}
.fpill:hover{ background:rgba(255,255,255,0.08); color:#fff; }
.fpill.active{ background:#fff; color:#000; border-color:#fff; }

/* Masonry Grid */
.grid{ columns:1; column-gap:24px; padding:20px 0; }
@media(min-width:600px){ .grid{ columns:2; } }
@media(min-width:900px){ .grid{ columns:3; } }
@media(min-width:1200px){ .grid{ columns:4; } }

.card{
    break-inside:avoid; background:var(--card-bg); border:1px solid var(--border);

.modal{ position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); z-index:1000; display:none; align-items:center; justify-content:center; padding:20px; }

.login-box input { width: 100%; padding: 15px; margin: 20px 0; border-radius: 12px; border: 1px solid var(--border); background: #000; color: #fff; font-family: inherit; font-size: 1rem; outline: none; }
.login-box button { width: 100%; padding: 15px; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 700; border: none; cursor: pointer; }

.upload-form { background: #0f0f13; border-radius: 24px; padding: 30px; width: 100%; max-width: 600px; border: 1px solid var(--border); }

.file-drop { border: 2px dashed var(--border); border-radius: 16px; padding: 30px; text-align: center; cursor: pointer; margin-bottom: 20px; }
.file-drop:hover { border-color: var(--primary); }
textarea, .upload-form input[type="text"] { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 12px; padding: 15px; color: #fff; font-family: inherit; margin-bottom: 15px; outline: none; }

/* Toast */
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #fff; color: #000; padding: 15px 30px; border-radius: 50px; font-weight: 700; transition: 0.4s; z-index: 9999; }
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

    if(!file) return toast('Select an image'); 
    if(!promptInput.value.trim()) return toast('Enter a prompt'); 
    if(!categoryInput.value.trim()) return toast('Enter a category'); 
    
    uploadBtn.disabled=true; uploadBtn.textContent='⏳ Uploading...'; 
    try{

        const j=await res.json(); 
        if(!j.success) throw new Error('Upload fail'); 
        
        await addDoc(collection(db,'prompts'),{
            image:j.data.url,
            prompt:promptInput.value.trim(),
            category:categoryInput.value.trim(),

};

window.copyPrompt=(t)=>{navigator.clipboard.writeText(t); toast('✅ Prompt copied!');};
window.deleteCard=async(id)=>{if(!isAdmin()) return toast('Admin only'); if(!confirm('Delete?')) return; await deleteDoc(doc(db,'prompts',id)); toast('Deleted'); load();};

    document.getElementById('modal').classList.remove('open'); 
    document.body.classList.remove('modal-open');
    window.history.replaceState(null, null, window.location.pathname);
  }
};

document.getElementById('modal').onclick = e => { if(e.target.id === 'modal') closeModal(); };
window.addEventListener('popstate', (e) => {
  if (!e.state || !e.state.modalOpen) {
    document.getElementById('modal').classList.remove('open');
    document.body.classList.remove('modal-open');

        </div>`;
    gallery.appendChild(div);
  });
